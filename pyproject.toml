[project]
name = "crypto-pay-cli"
version = "1.0.0"
description = "Check incoming USDT (TRC20) crypto payments and generate receive QR codes. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
crypto-pay = "pay:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["pay"]
