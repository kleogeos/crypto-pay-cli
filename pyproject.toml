[project]
name = "crypto-pay-cli"
version = "1.0.0"
description = "Check incoming USDT (TRC20) crypto payments and generate receive QR codes. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "kleogeos", email = "kleogeos@gmail.com"}]
keywords = ["usdt", "trc20", "crypto-payments", "qr-code", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/kleogeos/crypto-pay-cli"
Repository = "https://github.com/kleogeos/crypto-pay-cli"

[project.scripts]
crypto-pay = "pay:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["pay"]
